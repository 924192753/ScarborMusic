# =============================================================================
# ScarborMusic — Production Docker Compose (Tencent Cloud / CentOS Stream 9)
#
# 公网 IP + HTTP（默认）:
#   cp .env.production.ip.example .env.production
#   ./scripts/deploy-ip.sh
#   访问 http://159.75.87.182
#
# 域名 + HTTPS（可选）:
#   docker compose -f docker-compose.prod.yml --env-file .env.production --profile ssl up -d
# =============================================================================

name: scarbormusic-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ─── Next.js Web ──────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ${WEB_IMAGE:-scarbormusic/web:latest}
    container_name: scarbormusic-web
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/categories"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── MySQL 8.4 ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: scarbormusic-mysql
    restart: always
    env_file:
      - .env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scarbormusic}
      MYSQL_USER: ${MYSQL_USER:-scarbormusic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 2g
    cpus: 2
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
      --max-connections=300
      --slow-query-log=ON
      --long-query-time=2
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ─── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scarbormusic-redis
    restart: always
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── MinIO (S3-compatible storage) ──────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: scarbormusic-minio
    restart: always
    command: server /data --console-address ":9001"
    env_file:
      - .env.production
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: ${NGINX_IMAGE:-scarbormusic/nginx:latest}
    container_name: scarbormusic-nginx
    restart: always
    ports:
      - "80:80"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.5

  # ─── Certbot (Let's Encrypt — 仅域名 HTTPS 时启用: --profile ssl) ───────────────
  certbot:
    profiles:
      - ssl
    image: certbot/certbot:latest
    container_name: scarbormusic-certbot
    restart: always
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 128m
    entrypoint: /bin/sh -c
    command: >
      "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done"

  # ─── Monitoring: Prometheus ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: scarbormusic-prometheus
    restart: always
    volumes:
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 1g
    cpus: 1

  grafana:
    image: grafana/grafana:11.4.0
    container_name: scarbormusic-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 512m
    cpus: 0.5

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: scarbormusic-node-exporter
    restart: always
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 128m

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    container_name: scarbormusic-redis-exporter
    restart: always
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 64m

  mysql-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: scarbormusic-mysql-exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "${MYSQL_USER:-scarbormusic}:${MYSQL_PASSWORD}@(mysql:3306)/"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 128m

  # ─── Logging: Loki + Promtail ─────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.3.2
    container_name: scarbormusic-loki
    restart: always
    volumes:
      - ./docker/logging/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 512m

  promtail:
    image: grafana/promtail:3.3.2
    container_name: scarbormusic-promtail
    restart: always
    volumes:
      - ./docker/logging/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_logs:/var/log/nginx:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - scarbormusic_prod
    logging: *default-logging
    mem_limit: 256m

networks:
  scarbormusic_prod:
    driver: bridge
    name: scarbormusic_prod

volumes:
  mysql_data:
  redis_data:
  minio_data:
  certbot_www:
  certbot_certs:
  nginx_cache:
  prometheus_data:
  grafana_data:
  loki_data:
  nginx_logs:

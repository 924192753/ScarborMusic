name: scarbormusic

services:
  # ─── MySQL 8.4 ──────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: scarbormusic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-scarbormusic}
      MYSQL_USER: ${MYSQL_USER:-scarbormusic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - scarbormusic
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "--password=${MYSQL_ROOT_PASSWORD:-rootpassword}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=200
      --slow-query-log=ON
      --long-query-time=2

  # ─── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scarbormusic-redis
    restart: unless-stopped
    command: redis-server /etc/redis/redis.conf
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf:ro
    networks:
      - scarbormusic
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ─── MinIO (S3-compatible) ───────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: scarbormusic-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - scarbormusic
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ─── Networks ───────────────────────────────────────────────────────────────
networks:
  scarbormusic:
    driver: bridge
    name: scarbormusic_dev

# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local
    labels:
      com.scarbormusic.description: "MySQL persistent data"
  redis_data:
    driver: local
    labels:
      com.scarbormusic.description: "Redis persistent data"
  minio_data:
    driver: local
    labels:
      com.scarbormusic.description: "MinIO object storage data"

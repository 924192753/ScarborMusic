# =============================================================================
# Redis Configuration — ScarborMusic Development
# =============================================================================

# ─── Network ─────────────────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ─── General ─────────────────────────────────────────────────────────────────
daemonize no
loglevel notice
logfile ""
databases 16

# ─── Snapshotting (RDB) ──────────────────────────────────────────────────────
# Save snapshot: after 900s if at least 1 key changed
save 900 1
# Save snapshot: after 300s if at least 10 keys changed
save 300 10
# Save snapshot: after 60s if at least 10000 keys changed
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ─── Replication ─────────────────────────────────────────────────────────────
replica-serve-stale-data yes
replica-read-only yes

# ─── Append-Only File (AOF) ──────────────────────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ─── Memory Management ───────────────────────────────────────────────────────
maxmemory 256mb
# allkeys-lru: evict any key using LRU (best for cache use case)
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ─── Lazy Freeing ────────────────────────────────────────────────────────────
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# ─── Active Defragmentation ──────────────────────────────────────────────────
activedefrag no

# ─── Slow Log ────────────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ─── Latency Monitoring ──────────────────────────────────────────────────────
latency-monitor-threshold 0

# ─── Keyspace Notifications ──────────────────────────────────────────────────
# Enable keyspace events for expired keys (used for token TTL)
notify-keyspace-events "Ex"

# ─── Advanced ────────────────────────────────────────────────────────────────
hash-max-listpack-entries 128
hash-max-listpack-value 64
list-max-listpack-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-listpack-entries 128
zset-max-listpack-value 64
activerehashing yes
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
